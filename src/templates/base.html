<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LocalSFMC{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Surfaces — warm, soft, layered */
            --bg: #ffffff;
            --bg-page: #faf9f6;
            --bg-secondary: #f4f3ee;
            --bg-tertiary: #ece9e2;

            /* Text — warm-tinted greys */
            --text: #2d2a26;
            --text-secondary: #6b6862;
            --text-muted: #9b9a93;

            /* Borders */
            --border: #ece9e2;
            --border-light: #f4f3ee;

            /* Accents */
            --accent: #5b5bd6;
            --accent-hover: #4a4ac4;
            --accent-light: #ecebfa;

            /* Status */
            --red: #c64a3f;
            --red-light: #fbeae7;
            --green: #4f8b5e;
            --green-light: #ecf3ee;
            --amber: #cb912f;
            --amber-light: #fbf1dc;

            /* Radii — generous, calm */
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;

            /* Shadows — subtle, layered */
            --shadow-sm: 0 1px 2px rgba(15, 15, 15, 0.04);
            --shadow: 0 1px 3px rgba(15, 15, 15, 0.04), 0 4px 12px rgba(15, 15, 15, 0.04);
            --shadow-md: 0 2px 6px rgba(15, 15, 15, 0.05), 0 8px 24px rgba(15, 15, 15, 0.06);
            --shadow-lg: 0 4px 8px rgba(15, 15, 15, 0.04), 0 16px 40px rgba(15, 15, 15, 0.10);

            /* Aliases for legacy references */
            --radius-default: var(--radius);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14.5px;
            line-height: 1.55;
            color: var(--text);
            background: var(--bg-page);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            font-feature-settings: "cv11", "ss01";
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-hover); }

        h1, h2, h3, h4 {
            color: var(--text);
            font-family: 'Inter', sans-serif;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
        h2 { font-size: 20px; font-weight: 600; }
        h3 { font-size: 15px; font-weight: 600; }

        code {
            font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            background: var(--bg-secondary);
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 12.5px;
            color: var(--text);
        }

        /* Navbar — calm header strip, sits on cream page */
        .navbar {
            background: var(--bg);
            display: flex;
            align-items: center;
            padding: 0 28px;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: var(--shadow-sm);
        }
        .navbar-brand {
            color: var(--text);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.01em;
            text-decoration: none;
            margin-right: 32px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar-brand::before {
            content: "";
            width: 22px;
            height: 22px;
            border-radius: 7px;
            background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
        }
        .navbar-brand:hover { color: var(--text); text-decoration: none; }
        .navbar-links { display: flex; gap: 4px; }
        .navbar-links a {
            color: var(--text-secondary);
            font-size: 13.5px;
            font-weight: 500;
            padding: 8px 14px;
            border-radius: 8px;
            transition: background .12s, color .12s;
        }
        .navbar-links a:hover {
            color: var(--text);
            background: var(--bg-secondary);
            text-decoration: none;
        }
        .navbar-links a.active {
            color: var(--accent);
            background: var(--accent-light);
        }

        /* Containers */
        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 36px 28px 64px;
        }
        .container-narrow {
            max-width: 820px;
            margin: 0 auto;
            padding: 36px 28px 64px;
        }

        /* Cards — white islands on cream */
        .card {
            background: var(--bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .card-body { padding: 24px; }
        .card-flat {
            background: var(--bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 16px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            border-radius: 9px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background .12s, border-color .12s, box-shadow .12s, color .12s;
            text-decoration: none;
            white-space: nowrap;
            box-shadow: var(--shadow-sm);
        }
        .btn:hover {
            background: var(--bg-secondary);
            border-color: var(--border);
            text-decoration: none;
            color: var(--text);
        }
        .btn:disabled {
            opacity: .45;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-light);
            border-color: var(--accent);
        }
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 1px 2px rgba(91, 91, 214, 0.18), 0 4px 10px rgba(91, 91, 214, 0.20);
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            color: #fff;
        }
        .btn-danger {
            background: var(--bg);
            border-color: var(--border);
            color: var(--red);
        }
        .btn-danger:hover {
            background: var(--red-light);
            border-color: var(--red-light);
            color: var(--red);
        }
        .btn-ghost {
            background: transparent;
            border-color: transparent;
            box-shadow: none;
            color: var(--text-secondary);
        }
        .btn-ghost:hover {
            background: var(--bg-secondary);
            border-color: transparent;
            color: var(--text);
        }
        .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 7px; }
        .btn-lg { padding: 12px 22px; font-size: 14px; border-radius: 10px; }

        /* Inputs (shared base) */
        input[type="text"],
        input[type="number"],
        input[type="search"],
        select,
        textarea {
            font-family: inherit;
        }

        /* Utilities */
        .text-secondary { color: var(--text-secondary); }
        .text-muted { color: var(--text-muted); }
        .text-sm { font-size: 12.5px; }
        .text-xs { font-size: 11.5px; }
        .stack > * + * { margin-top: 14px; }
        .row { display: flex; gap: 10px; align-items: center; }
        .row-end { margin-left: auto; }

        /* Page header (used across most pages) */
        .page-header {
            margin-bottom: 28px;
        }
        .page-header h1 { font-size: 28px; font-weight: 700; }
        .page-header p {
            margin-top: 6px;
            font-size: 14.5px;
            color: var(--text-secondary);
            max-width: 600px;
        }

        /* Selection color */
        ::selection {
            background: var(--accent-light);
            color: var(--accent-hover);
        }

        /* Scrollbars (WebKit — soft, calm) */
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 6px;
            border: 3px solid var(--bg-page);
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        @media (max-width: 600px) {
            .navbar { padding: 0 16px; height: 56px; }
            .navbar-brand { margin-right: 16px; font-size: 14px; }
            .navbar-links a { padding: 6px 10px; font-size: 12.5px; }
            .container, .container-narrow { padding: 24px 16px 48px; }
            h1, .page-header h1 { font-size: 24px; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a class="navbar-brand" href="/">LocalSFMC</a>
        <div class="navbar-links">
            <a href="/search">Content Search</a>
            <a href="/journey">Journey Names</a>
            <a href="/html2pdf">HTML2PDF</a>
        </div>
    </nav>

    <main class="{% block container_class %}container{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    <script>
        (function () {
            const path = window.location.pathname;
            document.querySelectorAll('.navbar-links a').forEach(a => {
                const href = a.getAttribute('href');
                if (href !== '/' && path.startsWith(href)) a.classList.add('active');
            });
        })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
