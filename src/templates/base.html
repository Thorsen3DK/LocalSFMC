<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>{% block title %}TScrew Loose Lab{% endblock %}</title>
    <style>
        :root {
            --accent: #568EA3;
            --accent-light: rgba(86,142,163,0.1);
            --accent-hover: #68C3D4;
            --bg: #fff;
            --text: #2c2c2c;
            --text-muted: #999;
            --border: #e8e8e8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background: #568EA3;
            display: flex;
            align-items: center;
            padding: 0 30px;
            height: 56px;
            gap: 0;
        }
        .navbar-brand {
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            margin-right: 36px;
            letter-spacing: -0.3px;
        }
        .navbar-brand:hover { color: #fff; }
        .navbar-links {
            display: flex;
            gap: 4px;
            list-style: none;
        }
        .navbar-links a {
            color: rgba(255,255,255,0.75);
            text-decoration: none;
            font-size: 0.84rem;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.15s;
        }
        .navbar-links a:hover {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }
        .navbar-links a.active {
            color: #fff;
            background: rgba(255,255,255,0.15);
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .navbar { padding: 0 12px; height: 50px; }
            .navbar-brand { margin-right: 16px; font-size: 0.9rem; }
            .navbar-links a { padding: 6px 10px; font-size: 0.78rem; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a class="navbar-brand" href="/">TScrew Loose Lab</a>
        <div class="navbar-links">
            <a href="/journey" id="nav-journey">Journey Generator</a>
            <a href="/search" id="nav-search">Content Search</a>
            <a href="/html2pdf" id="nav-html2pdf">HTML2PDF</a>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <script>
        // Highlight active nav link
        (function() {
            const path = window.location.pathname;
            document.querySelectorAll('.navbar-links a').forEach(link => {
                if (path.startsWith(link.getAttribute('href'))) {
                    link.classList.add('active');
                }
            });
        })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
